<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBS & Technical Analytics Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .th-sortable {
            cursor: pointer;
            user-select: none;
        }
        .th-sortable:hover {
            color: #34d399;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 md:p-6 font-sans">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-5 gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-teal-200">
                    RBS Analytics Hub
                </h1>
                <p class="text-slate-400 text-xs md:text-sm">Real-Time NSE F&O Screener & Technical Oscillators</p>
            </div>
            <div class="flex items-center gap-3 w-full md:w-auto">
                <input type="text" id="searchInput" placeholder="Search symbol..." 
                    class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-emerald-500 w-full md:w-64 transition shadow-inner text-slate-100 placeholder-slate-500">
                <button onclick="refreshCurrentTab()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white px-5 py-2 rounded-xl text-sm font-semibold transition shadow-lg shadow-emerald-900/30 whitespace-nowrap">
                    Refresh
                </button>
            </div>
        </header>

        <!-- Dynamic Navigation Tabs -->
        <div class="flex border-b border-slate-800 mb-4 gap-2 overflow-x-auto">
            <button id="tabRbsBtn" onclick="switchTab('rbs')" 
                class="py-2.5 px-4 font-semibold text-sm border-b-2 border-emerald-500 text-emerald-400 transition focus:outline-none whitespace-nowrap">
                Original RBS Screener
            </button>
            <button id="tabTechBtn" onclick="switchTab('tech')" 
                class="py-2.5 px-4 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition focus:outline-none whitespace-nowrap">
                Technical Matrix (RSI/MFI/W%R)
            </button>
        </div>

        <!-- Technical Filters Bar -->
        <div id="techFilterBar" class="hidden flex-wrap items-center gap-2 mb-4 bg-slate-900/90 p-3 rounded-xl border border-slate-800/80 text-xs shadow-md">
            <span class="text-slate-400 font-semibold mr-1">Quick Filters:</span>
            <button onclick="filterTech('all')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700">All Scrips</button>
            <button onclick="filterTech('rsi_60')" class="bg-emerald-950/80 text-emerald-300 hover:bg-emerald-900 px-3 py-1.5 rounded-lg border border-emerald-800/80">RSI > 60 (Bullish)</button>
            <button onclick="filterTech('rsi_40')" class="bg-rose-950/80 text-rose-300 hover:bg-rose-900 px-3 py-1.5 rounded-lg border border-rose-800/80">RSI < 40 (Bearish)</button>
            <button onclick="filterTech('williams_oversold')" class="bg-amber-950/80 text-amber-300 hover:bg-amber-900 px-3 py-1.5 rounded-lg border border-amber-800/80">Williams %R Oversold (<-80)</button>
        </div>

        <!-- Status Bar -->
        <div class="flex justify-between items-center bg-slate-900/60 border border-slate-800/70 rounded-xl px-4 py-2.5 mb-4 text-xs">
            <span id="statusText" class="text-slate-400 font-medium">Connecting to service...</span>
            <span id="lastUpdated" class="text-slate-500 font-mono"></span>
        </div>

        <!-- Interactive Data Table Container -->
        <div class="bg-slate-900/90 border border-slate-800/90 rounded-2xl overflow-hidden shadow-2xl backdrop-blur-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead id="tableHead">
                        <!-- Headings populated dynamically with sort handlers -->
                    </thead>
                    <tbody id="screenerTableBody" class="divide-y divide-slate-800/60 text-sm">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-slate-500 font-medium">Loading live ticks from 222 F&O scrips...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://rbs-backend-g271.onrender.com";
        let activeTab = "rbs";
        let rawData = [];
        let displayedData = [];
        let sortColumn = "";
        let sortAsc = false;

        function switchTab(tab) {
            activeTab = tab;
            sortColumn = "";
            sortAsc = false;
            const rbsBtn = document.getElementById("tabRbsBtn");
            const techBtn = document.getElementById("tabTechBtn");
            const techFilterBar = document.getElementById("techFilterBar");

            if (tab === "rbs") {
                rbsBtn.className = "py-2.5 px-4 font-semibold text-sm border-b-2 border-emerald-500 text-emerald-400 transition focus:outline-none whitespace-nowrap";
                techBtn.className = "py-2.5 px-4 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition focus:outline-none whitespace-nowrap";
                techFilterBar.classList.add("hidden");
            } else {
                techBtn.className = "py-2.5 px-4 font-semibold text-sm border-b-2 border-emerald-500 text-emerald-400 transition focus:outline-none whitespace-nowrap";
                rbsBtn.className = "py-2.5 px-4 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition focus:outline-none whitespace-nowrap";
                techFilterBar.classList.remove("hidden");
            }

            refreshCurrentTab();
        }

        async function refreshCurrentTab() {
            const statusText = document.getElementById("statusText");
            const lastUpdated = document.getElementById("lastUpdated");
            statusText.textContent = `Fetching 222 F&O market ticks for ${activeTab.toUpperCase()}...`;

            const endpoint = activeTab === "rbs" ? "/api/screener" : "/api/indicators";

            try {
                const response = await fetch(BASE_URL + endpoint);
                const data = await response.json();
                rawData = data.symbols || [];
                displayedData = [...rawData];

                renderHeader();
                renderTable(displayedData);

                statusText.textContent = `Live Stream Active (${rawData.length} F&O symbols active)`;
                lastUpdated.textContent = `Updated: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error("Error fetching data:", error);
                statusText.textContent = "Error connecting to backend API.";
            }
        }

        function handleSort(key) {
            if (sortColumn === key) {
                sortAsc = !sortAsc;
            } else {
                sortColumn = key;
                sortAsc = true;
            }

            displayedData.sort((a, b) => {
                let valA = a[key];
                let valB = b[key];

                if (typeof valA === 'string') {
                    return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else {
                    return sortAsc ? valA - valB : valB - valA;
                }
            });

            renderHeader();
            renderTable(displayedData);
        }

        function getSortIndicator(key) {
            if (sortColumn !== key) return `<span class="text-slate-600 ml-1">↕</span>`;
            return sortAsc ? `<span class="text-emerald-400 ml-1">▲</span>` : `<span class="text-emerald-400 ml-1">▼</span>`;
        }

        function renderHeader() {
            const thead = document.getElementById("tableHead");
            if (activeTab === "rbs") {
                thead.innerHTML = `
                    <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase bg-slate-950/70">
                        <th onclick="handleSort('symbol')" class="p-4 th-sortable font-semibold">Symbol ${getSortIndicator('symbol')}</th>
                        <th onclick="handleSort('live_price')" class="p-4 th-sortable font-semibold">Price (₹) ${getSortIndicator('live_price')}</th>
                        <th onclick="handleSort('change_pct')" class="p-4 th-sortable font-semibold">Change % ${getSortIndicator('change_pct')}</th>
                        <th onclick="handleSort('volume')" class="p-4 th-sortable font-semibold">Volume ${getSortIndicator('volume')}</th>
                        <th onclick="handleSort('combined_score')" class="p-4 th-sortable font-semibold">Combined Score ${getSortIndicator('combined_score')}</th>
                        <th onclick="handleSort('rbs_ratio')" class="p-4 th-sortable font-semibold">RBS Ratio ${getSortIndicator('rbs_ratio')}</th>
                        <th onclick="handleSort('status')" class="p-4 th-sortable font-semibold">Signal Status ${getSortIndicator('status')}</th>
                    </tr>
                `;
            } else {
                thead.innerHTML = `
                    <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase bg-slate-950/70">
                        <th onclick="handleSort('symbol')" class="p-4 th-sortable font-semibold">Symbol ${getSortIndicator('symbol')}</th>
                        <th onclick="handleSort('live_price')" class="p-4 th-sortable font-semibold">Price (₹) ${getSortIndicator('live_price')}</th>
                        <th onclick="handleSort('change_pct')" class="p-4 th-sortable font-semibold">Change % ${getSortIndicator('change_pct')}</th>
                        <th onclick="handleSort('rsi')" class="p-4 th-sortable font-semibold">RSI (14) ${getSortIndicator('rsi')}</th>
                        <th onclick="handleSort('mfi')" class="p-4 th-sortable font-semibold">MFI (14) ${getSortIndicator('mfi')}</th>
                        <th onclick="handleSort('williams_r')" class="p-4 th-sortable font-semibold">Williams %R ${getSortIndicator('williams_r')}</th>
                        <th onclick="handleSort('signal')" class="p-4 th-sortable font-semibold">Signal Status ${getSortIndicator('signal')}</th>
                    </tr>
                `;
            }
        }

        function renderTable(symbols) {
            const tbody = document.getElementById("screenerTableBody");
            tbody.innerHTML = "";

            if (symbols.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-500">No symbols matching query.</td></tr>`;
                return;
            }

            symbols.forEach(item => {
                const isPositive = item.change_pct >= 0;
                const changeClass = isPositive ? "text-emerald-400 font-medium" : "text-rose-400 font-medium";
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-800/50 transition border-b border-slate-800/40";

                if (activeTab === "rbs") {
                    let badgeClass = "bg-slate-800 text-slate-300";
                    if (item.status === "Breakout Above") badgeClass = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
                    if (item.status === "Breakdown Below") badgeClass = "bg-rose-500/10 text-rose-400 border border-rose-500/30";

                    tr.innerHTML = `
                        <td class="p-4 font-bold text-white tracking-wide">${item.symbol}</td>
                        <td class="p-4 font-mono">₹${item.live_price.toLocaleString('en-IN')}</td>
                        <td class="p-4 font-mono ${changeClass}">${isPositive ? '+' : ''}${item.change_pct}%</td>
                        <td class="p-4 font-mono text-slate-300">${item.volume.toLocaleString('en-IN')}</td>
                        <td class="p-4 font-mono ${item.combined_score >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${item.combined_score.toLocaleString('en-IN')}</td>
                        <td class="p-4 font-mono font-semibold">${item.rbs_ratio}</td>
                        <td class="p-4"><span class="px-3 py-1 rounded-full text-xs font-semibold ${badgeClass}">${item.status}</span></td>
                    `;
                } else {
                    let badgeClass = "bg-slate-800 text-slate-300";
                    if (item.signal === "Bullish Momentum") badgeClass = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
                    if (item.signal === "Bearish Momentum") badgeClass = "bg-rose-500/10 text-rose-400 border border-rose-500/30";

                    tr.innerHTML = `
                        <td class="p-4 font-bold text-white tracking-wide">${item.symbol}</td>
                        <td class="p-4 font-mono">₹${item.live_price.toLocaleString('en-IN')}</td>
                        <td class="p-4 font-mono ${changeClass}">${isPositive ? '+' : ''}${item.change_pct}%</td>
                        <td class="p-4 font-mono ${item.rsi > 60 ? 'text-emerald-400 font-bold' : (item.rsi < 40 ? 'text-rose-400 font-bold' : 'text-slate-300')}">${item.rsi}</td>
                        <td class="p-4 font-mono ${item.mfi > 60 ? 'text-emerald-400' : (item.mfi < 40 ? 'text-rose-400' : 'text-slate-300')}">${item.mfi}</td>
                        <td class="p-4 font-mono ${item.williams_r > -20 ? 'text-emerald-400' : (item.williams_r < -80 ? 'text-amber-400 font-bold' : 'text-slate-300')}">${item.williams_r}</td>
                        <td class="p-4"><span class="px-3 py-1 rounded-full text-xs font-semibold ${badgeClass}">${item.signal}</span></td>
                    `;
                }

                tbody.appendChild(tr);
            });
        }

        function filterTech(type) {
            if (activeTab !== "tech") return;
            if (type === 'rsi_60') displayedData = rawData.filter(i => i.rsi > 60);
            else if (type === 'rsi_40') displayedData = rawData.filter(i => i.rsi < 40);
            else if (type === 'williams_oversold') displayedData = rawData.filter(i => i.williams_r < -80);
            else displayedData = [...rawData];

            renderHeader();
            renderTable(displayedData);
        }

        document.getElementById("searchInput").addEventListener("input", (e) => {
            const query = e.target.value.toLowerCase();
            displayedData = rawData.filter(item => item.symbol.toLowerCase().includes(query));
            renderHeader();
            renderTable(displayedData);
        });

        switchTab("rbs");
    </script>
</body>
            </html>
